name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: Unit tests
        run: pytest -q
      - name: Pipeline evaluation (stub LLM, no GPU)
        run: python -m evaluation.run_eval --suite multi --llm stub --no-rag --out results_ci.json
