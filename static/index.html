<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenovo AI Sales Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #E2231A; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
  .header-info h1 { font-size: 14px; font-weight: 600; opacity: 0.9; }
  .header-info p { font-size: 11px; opacity: 0.7; margin-top: 1px; }
  #conn-badge { margin-left: auto; font-size: 11px; padding: 3px 10px; border-radius: 12px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
  #reset-btn { font-size: 11px; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); cursor: pointer; margin-left: 8px; transition: all 0.15s; }
  #reset-btn:hover { background: rgba(255,255,255,0.3); }
  #messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .msg-avatar.bot { background: #E2231A; color: white; }
  .msg-avatar.user { background: #333; color: white; }
.bubble { max-width: 70%; min-width: 40px; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word; }  .bubble.bot { background: white; color: #1a1a1a; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.bubble.user { background: #333; color: white; border-radius: 16px 16px 4px 16px; min-width: 60px; white-space: pre-wrap; }  .bubble p { margin-bottom: 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { font-weight: 600; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 4px 0; }
  .bubble li { margin-bottom: 3px; }
  .bubble a { color: #E2231A; text-decoration: none; font-weight: 500; }
  .bubble a:hover { text-decoration: underline; }
  .msg-time { font-size: 10px; color: #aaa; margin-top: 4px; }
  .msg-row.user .msg-time { text-align: right; }
  .metrics { font-size: 10px; color: #bbb; margin-top: 2px; font-family: monospace; }
  #quick-replies { display: flex; gap: 8px; padding: 8px 24px 4px; flex-wrap: wrap; }
  .qr-btn { padding: 7px 16px; border: 1.5px solid #E2231A; border-radius: 20px; background: white; color: #E2231A; font-size: 12px; cursor: pointer; transition: all 0.15s; font-weight: 500; }
  .qr-btn:hover { background: #E2231A; color: white; }
  #input-area { padding: 12px 24px 16px; background: white; border-top: 1px solid #e8e8e8; display: flex; gap: 10px; align-items: center; }
  #input { flex: 1; padding: 10px 18px; border: 1.5px solid #e0e0e0; border-radius: 24px; font-size: 14px; outline: none; transition: border 0.2s; background: #f8f8f8; }
  #input:focus { border-color: #E2231A; background: white; }
  #send { width: 40px; height: 40px; background: #E2231A; color: white; border: none; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  #send:hover { background: #c41e16; transform: scale(1.05); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .cta-area { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .cta-btn { padding: 6px 14px; border-radius: 16px; font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.15s; border: 1.5px solid; }
  .cta-action { background: white; color: #E2231A; border-color: #E2231A; }
  .cta-action:hover { background: #E2231A; color: white; }
  .cta-crosssell { background: white; color: #555; border-color: #ccc; }
  .cta-crosssell:hover { background: #f5f5f5; }
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-dot { width: 7px; height: 7px; background: #ccc; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); background: #E2231A; } }
</style>
</head>
<body>

<div id="header">
  <div class="logo">Lenovo</div>
  <div class="header-info">
    <h1>AI Sales Assistant</h1>
    <p>Powered by local AI — your data stays private</p>
  </div>
  <button id="reset-btn" onclick="resetChat()">↺ New Chat</button>
  <div id="conn-badge">Connecting...</div>
</div>

<div id="messages"></div>

<div id="quick-replies">
  <button class="qr-btn" onclick="send('What laptops do you recommend for gaming under $1500?')">Gaming under $1500</button>
  <button class="qr-btn" onclick="send('I need a business laptop for travel, lightweight preferred')">Business travel</button>
  <button class="qr-btn" onclick="send('What is the best ThinkPad for enterprise use?')">Best ThinkPad</button>
  <button class="qr-btn" onclick="send('I am a student with a $600 budget')">Student budget</button>
  <button class="qr-btn" onclick="send('Compare Legion 5i vs Legion 7i')">Compare Legion</button>
</div>

<div id="input-area">
  <input id="input" type="text" placeholder="Ask about any Lenovo laptop..." onkeydown="if(event.key==='Enter')sendInput()" />
  <button id="send" onclick="sendInput()">➤</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const connBadge = document.getElementById('conn-badge');
  let ws = null, botBubble = null, botText = '', currentMetrics = null, lastBotRow = null;

  function now() { return new Date().toLocaleTimeString('en', {hour:'2-digit', minute:'2-digit'}); }

  function addWelcomeMessage() {
    messagesEl.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="msg-avatar bot">L</div><div><div class="bubble bot">Hi! I'm your Lenovo AI Sales Assistant. I have detailed information on <strong>60 Lenovo laptops</strong> across ThinkPad, ThinkBook, Legion, and IdeaPad series.<br><br>What are you looking for today?</div><div class="msg-time">${now()}</div></div>`;
    messagesEl.appendChild(row);
  }

  function resetChat() {
    if (ws && ws.readyState === 1) {
      ws.close();
    }
    botBubble = null; botText = ''; currentMetrics = null; lastBotRow = null;
    sendBtn.disabled = false; input.disabled = false;
    connect();
  }

  function connect() {
    ws = new WebSocket('ws://localhost:8000/ws/chat');

    ws.onopen = () => {
      connBadge.textContent = 'Connected';
      connBadge.style.background = 'rgba(0,200,100,0.3)';
      addWelcomeMessage();
    };

    ws.onclose = () => {
      connBadge.textContent = 'Reconnecting...';
      connBadge.style.background = 'rgba(255,100,100,0.3)';
      setTimeout(connect, 3000);
    };

    ws.onmessage = (e) => {
      // Remove typing indicator on first token
      const ti = document.getElementById('typing-indicator');
      if (ti) ti.remove();

      if (e.data.startsWith('[METRICS]')) {
        const raw = e.data.replace('[METRICS] ', '');
        if (currentMetrics) currentMetrics.textContent = raw;
        return;
      }

      if (e.data.startsWith('[CTA]')) {
        try {
          const cta = JSON.parse(e.data.slice(5));
          if (lastBotRow) {
            const ctaArea = document.createElement('div');
            ctaArea.className = 'cta-area';
            cta.actions.forEach(a => {
              const btn = document.createElement('button');
              btn.className = 'cta-btn cta-action';
              btn.textContent = a.label;
              btn.onclick = () => {
                if (a.action === 'rep') send('I would like to talk to a sales representative');
                else if (a.action === 'compare') send('Can you compare these models side by side?');
                else if (a.action === 'specs') send('Can you show me the full specs for your top recommendation?');
              };
              ctaArea.appendChild(btn);
            });
            if (cta.crosssell && cta.crosssell.length > 0) {
              cta.crosssell.forEach(cs => {
                const btn = document.createElement('button');
                btn.className = 'cta-btn cta-crosssell';
                btn.textContent = cs.label;
                btn.onclick = () => send(cs.msg);
                ctaArea.appendChild(btn);
              });
            }
            lastBotRow.appendChild(ctaArea);
          }
        } catch(err) { console.error('CTA error:', err); }
        return;
      }

      if (e.data === '[DONE]') {
        if (botBubble) botBubble.innerHTML = marked.parse(botText);
        botBubble = null; botText = '';
        sendBtn.disabled = false; input.disabled = false; input.focus();
        return;
      }

      if (!botBubble) {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        const right = document.createElement('div');
        botBubble = document.createElement('div');
        botBubble.className = 'bubble bot';
        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = now();
        currentMetrics = document.createElement('div');
        currentMetrics.className = 'metrics';
        right.appendChild(botBubble);
        right.appendChild(time);
        right.appendChild(currentMetrics);
        row.innerHTML = `<div class="msg-avatar bot">L</div>`;
        row.appendChild(right);
        lastBotRow = right;
        messagesEl.appendChild(row);
      }
      botText += e.data;
      botBubble.innerHTML = marked.parse(botText);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };
  }

  function send(text) {
    if (!ws || ws.readyState !== 1 || !text.trim()) return;

    // User message bubble
    const userRow = document.createElement('div');
    userRow.className = 'msg-row user';
    const userBubble = document.createElement('div');
    userBubble.className = 'bubble user';
    userBubble.textContent = text;
    const userTime = document.createElement('div');
    userTime.className = 'msg-time';
    userTime.textContent = now();
    const userRight = document.createElement('div');
    userRight.style.maxWidth = '70%';
    userRight.style.minWidth = '60px';
    userRight.appendChild(userBubble);
    userRight.appendChild(userTime);
    userRow.innerHTML = `<div class="msg-avatar user">You</div>`;
    userRow.appendChild(userRight);
    messagesEl.appendChild(userRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    sendBtn.disabled = true; input.disabled = true;
    ws.send(text);

    // Typing indicator
    const typingRow = document.createElement('div');
    typingRow.className = 'msg-row bot';
    typingRow.id = 'typing-indicator';
    typingRow.innerHTML = `<div class="msg-avatar bot">L</div><div><div class="bubble bot"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
    messagesEl.appendChild(typingRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function sendInput() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send(text);
  }

  connect();
</script>
</body>
</html>
